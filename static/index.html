<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novotel Medina - Daily Reports</title>
  <link rel="stylesheet" href="/assets/style.css?v=22">
  <link rel="icon" href="/assets/novotel-logo-blue.png">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen" style="display:none;">
    <div class="login-card">
      <img src="/assets/novotel-logo-blue.png" class="login-logo" alt="Novotel logo">

      <input type="text" id="login-username" placeholder="Username" autocomplete="username" autocapitalize="off">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="dmr-btn dmr-btn-primary login-btn">Sign In</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- Main App -->
  <div class="dmr-root" id="dmrRoot" style="display:none;">
    <header class="dmr-topbar">
      <span class="topbar-mark"><img src="/assets/novotel-logo-blue.png" class="topbar-logo" alt="Novotel"></span>
      <span id="mobileCrumb">Today's Report</span>
      <button type="button" id="menuBtn" aria-expanded="false" aria-controls="dmrNav">Menu</button>
    </header>
    <button type="button" class="dmr-backdrop" id="navBackdrop" hidden aria-label="Close menu"></button>
    <nav class="dmr-nav" id="dmrNav" aria-label="Sections">
      <button type="button" class="nav-close" id="navClose">Close</button>
      <div class="brand">
        <img src="/assets/novotel-logo-blue.png" class="brand-logo" alt="Novotel">

      </div>

      <div class="sync-status">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Connected</span>
      </div>

      <button class="dmr-navbtn" data-section="full" data-view="today">Dashboard</button>

      <div class="nav-section" data-nav-for="duty">Duty Manager</div>
      <button class="dmr-navbtn" data-section="duty" data-view="today">Today's Report</button>
      <button class="dmr-navbtn" data-section="duty" data-view="archive">Archive</button>
      <button class="dmr-navbtn" data-section="duty" data-view="analysis">Analysis</button>
      <div class="nav-section" data-nav-for="night">Night Manager</div>
      <button class="dmr-navbtn" data-section="night" data-view="today">Today's Report</button>
      <button class="dmr-navbtn" data-section="night" data-view="archive">Archive</button>
      <button class="dmr-navbtn" data-section="night" data-view="analysis">Analysis</button>
      <div class="nav-section">Guest Relation</div>
      <button class="dmr-navbtn" data-section="guest" data-view="today">Today's Report</button>
      <button class="dmr-navbtn" data-section="guest" data-view="archive">Archive</button>
      <button class="dmr-navbtn" data-section="guest" data-view="analysis">Analysis</button>
      <div class="nav-section" data-nav-for="general">General</div>
      <button class="dmr-navbtn" data-view="users" id="usersNavBtn" style="display:none;">Users</button>
      <button class="dmr-navbtn" data-view="settings" id="settingsNavBtn" style="display:none;">Settings</button>

      <div class="dmr-nav-foot">
        <div id="navNameBlock">
          <span class="nav-name" id="navName">—</span>
          <span class="nav-title" id="navTitle"></span>
        </div>
        <button id="logoutBtn">Logout</button>
      </div>
    </nav>

    <div class="dmr-main" id="dmrMain"></div>
  </div>

  <!-- Hidden input for checklist item photo uploads -->
  <input type="file" id="checklistPhotoInput" accept="image/*" style="display:none;">

  <!-- Third-party CDN libraries -->
  <script src="/assets/jspdf.umd.min.js"></script>
  <script src="/assets/chart.umd.min.js"></script>
  <script src="/assets/routes.js?v=1"></script>
  <script src="/assets/app.js?v=41"></script>
  <script src="/assets/night.js?v=48"></script>
  <script src="/assets/guest.js?v=23"></script>
</body>
</html>
